<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#edf5ff"><title>Pyro HR · ระบบบริหารบุคลากร</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>*{box-sizing:border-box}body{font-family:Kanit,sans-serif;color:#34415a;background:#f7f9fd}button,input,select,textarea{font:inherit}button{transition:transform .15s,box-shadow .15s}button:hover:not(:disabled){transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait}.soft{box-shadow:0 12px 30px rgba(98,116,155,.09)}.field{width:100%;background:#f8faff;border:1px solid #e3e9f5;border-radius:14px;padding:10px 12px;outline:none}.field:focus{border-color:#8eaff3;box-shadow:0 0 0 3px #dfe9ff}.btn{border-radius:14px;padding:10px 16px;font-weight:500}.primary{background:#7b9eee;color:white}.secondary{background:#eef3ff;color:#4e6caa}.danger{background:#fff0f0;color:#d35f6a}.nav-active{background:#edf3ff;color:#547de2}.hide-scroll::-webkit-scrollbar{display:none}#toast{transition:opacity .2s} .spinner{width:18px;height:18px;border:3px solid #dae5ff;border-top-color:#7393df;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:768px){main{margin-left:250px}}@media(max-width:767px){main{padding-bottom:94px}}[hidden]{display:none!important}</style>
</head><body>
<div id="auth-screen" class="min-h-screen flex items-center justify-center p-5 bg-gradient-to-br from-[#e8f4ff] via-[#fff1f6] to-[#fff7d9]">
 <div class="w-full max-w-md bg-white/95 rounded-[30px] p-7 sm:p-10 soft"><div class="text-5xl mb-4">🌷</div><h1 class="text-3xl font-semibold">Pyro HR</h1><p class="text-slate-500 mt-1 mb-6">ระบบทะเบียนพนักงานและประวัติการอบรม</p><form id="login-form" class="space-y-4"><label class="block text-sm">อีเมล<input id="login-email" type="email" required class="field mt-1" autocomplete="username" placeholder="admin@example.com"></label><label class="block text-sm">รหัสผ่าน<input id="login-password" type="password" required class="field mt-1" autocomplete="current-password"></label><button id="login-button" class="btn primary w-full" type="submit">เข้าสู่ระบบ</button><p class="text-xs text-slate-500">สร้างผู้ใช้ทดสอบใน Supabase → Authentication → Users ก่อนเข้าสู่ระบบ</p></form></div>
</div>
<div id="app" hidden>
<aside class="hidden md:flex fixed left-0 top-0 bottom-0 w-[250px] z-30 flex-col bg-white border-r border-slate-100 px-4 py-7"><div class="flex items-center gap-3 px-3 mb-9"><div class="w-12 h-12 rounded-2xl bg-[#e7f1ff] grid place-items-center text-2xl">🌷</div><div><b class="text-xl">Pyro HR</b><p class="text-xs text-slate-400">People & Learning</p></div></div><nav id="desktop-nav" class="space-y-1"></nav><div class="mt-auto p-3 rounded-2xl bg-[#fff6dc] text-xs text-slate-600">ข้อมูลพนักงานและการอบรม<br>เชื่อมต่อ Supabase</div><button data-action="logout" class="btn text-left mt-3 text-rose-500 flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i> ออกจากระบบ</button></aside>
<main class="min-h-screen px-4 sm:px-7 lg:px-10 py-5 sm:py-8"><header class="flex items-center justify-between gap-3 mb-7"><div><div class="text-sm text-slate-400">People Management <span class="text-rose-300">✦</span></div><h1 id="page-title" class="text-2xl sm:text-3xl font-semibold mt-1">แดชบอร์ดภาพรวม</h1><p id="page-subtitle" class="text-xs sm:text-sm text-slate-400 mt-1">ข้อมูลพนักงานทุกสาขา</p></div><div class="flex gap-2 items-center"><button data-action="refresh" title="รีเฟรชข้อมูล" class="p-3 bg-white rounded-xl shadow-sm"><i data-lucide="refresh-cw" class="w-5 h-5"></i></button><div class="w-10 h-10 sm:w-12 sm:h-12 bg-[#ffe5ed] rounded-full grid place-items-center text-xl">👩🏻‍💼</div></div></header><div id="content"></div></main>
<div class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur border-t border-slate-100 pb-[env(safe-area-inset-bottom)]"><div class="grid grid-cols-4 gap-1 px-2 py-2"><button class="bottom-btn flex flex-col items-center text-xs gap-1 p-2" data-page="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i>ภาพรวม</button><button class="bottom-btn flex flex-col items-center text-xs gap-1 p-2" data-page="employees"><i data-lucide="users" class="w-5 h-5"></i>พนักงาน</button><button class="bottom-btn flex flex-col items-center text-xs gap-1 p-2" data-page="training"><i data-lucide="graduation-cap" class="w-5 h-5"></i>อบรม</button><button class="bottom-btn flex flex-col items-center text-xs gap-1 p-2" data-action="toggle-menu"><i data-lucide="grid-2x2" class="w-5 h-5"></i>เมนูทั้งหมด</button></div></div>
<div id="mobile-menu" hidden class="md:hidden fixed inset-0 z-40 bg-slate-900/30 flex items-end" data-action="close-menu"><div class="bg-white rounded-t-[28px] p-5 w-full pb-10" onclick="event.stopPropagation()"><div class="flex justify-between items-center mb-5"><b class="text-xl">เมนูจัดการทั้งหมด</b><button data-action="close-menu" class="p-2 rounded-xl bg-slate-100"><i data-lucide="x"></i></button></div><div id="mobile-menu-grid" class="grid grid-cols-3 gap-3"></div><button data-action="logout" class="btn danger w-full mt-5">ออกจากระบบ</button></div></div>
</div>
<div id="modal" hidden class="fixed inset-0 bg-slate-900/50 z-50 p-3 sm:p-6 flex items-center justify-center"><div class="bg-white rounded-[26px] w-full max-w-2xl max-h-[93vh] overflow-y-auto soft"><div class="flex justify-between items-center p-5 border-b border-slate-100"><h2 id="modal-title" class="text-xl font-semibold"></h2><button data-action="close-modal" class="p-2 rounded-xl bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button></div><form id="modal-form" class="p-5 space-y-4"></form></div></div>
<div id="toast" hidden class="fixed right-4 top-4 z-[70] bg-slate-800 text-white max-w-sm rounded-2xl px-5 py-3 shadow-xl text-sm"></div>
<div id="busy" hidden class="fixed inset-0 bg-white/45 z-[60] flex justify-center items-center"><div class="bg-white rounded-2xl p-5 soft flex gap-3 items-center"><div class="spinner"></div><span id="busy-text">กำลังดำเนินการ...</span></div></div>
<script src="./config.js"></script><script>
'use strict';
// Use dbClient, NEVER a variable named supabase.
const dbClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={page:'dashboard', search:'', branch:'', data:{}, chart:null, user:null};
const tables=['hr_branches','hr_departments','hr_positions','hr_employees','hr_courses','hr_training_sessions','hr_training_records'];
const menus=[['dashboard','layout-dashboard','ภาพรวม'],['employees','users','ทะเบียนพนักงาน'],['training','graduation-cap','ประวัติอบรม'],['courses','book-open','หลักสูตร'],['reports','chart-column','รายงาน'],['settings','settings','ตั้งค่า/ข้อมูลหลัก']];
const titles={dashboard:['แดชบอร์ดภาพรวม','สรุปข้อมูลพนักงานและการอบรม'],employees:['ทะเบียนพนักงาน','จัดการข้อมูลประวัติพนักงาน'],training:['ประวัติการอบรม','จัดการรอบอบรมและผู้เข้าอบรม'],courses:['หลักสูตรอบรม','รายการหลักสูตรและอายุใบรับรอง'],reports:['รายงานภาพรวม','สถิติแยกสาขาและหลักสูตร'],settings:['ตั้งค่าข้อมูลหลัก','สาขา แผนก และตำแหน่งงาน']};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function attr(v){return esc(v);} function fmt(d){if(!d)return '-';const dt=new Date(d+'T00:00:00');return isNaN(dt)?'-':dt.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'});}
function shortDate(d){return d?String(d).slice(0,10):'';}
function arr(t){return state.data['hr_'+t]||[];}function by(t,id){return arr(t).find(x=>x.id===id);}function name(t,id){return by(t,id)?.name||'-';}
function empName(id){const e=by('employees',id);return e?e.first_name+' '+e.last_name:'-';}
function courseName(id){return by('courses',id)?.title||'-';}
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.style.background=error?'#a94055':'#334155';el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3900);}
function busy(on,msg='กำลังดำเนินการ...'){$('#busy').hidden=!on;$('#busy-text').textContent=msg;}
function icons(){window.lucide?.createIcons();}
function failure(err){console.error(err);toast(err?.message||'เกิดข้อผิดพลาด โปรดลองอีกครั้ง',true);}
function photo(e,size=46){const url=e.photo_path?dbClient.storage.from('hr-photos').getPublicUrl(e.photo_path).data.publicUrl:'';return `<div class="shrink-0 rounded-2xl bg-[#eaf0ff] overflow-hidden grid place-items-center text-xl" style="width:${size}px;height:${size}px">${url?`<img src="${attr(url)}" class="w-full h-full object-cover" alt="รูปพนักงาน" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'ไม่มีรูป'}))">`:'👤'}</div>`;}
function card(title,value,icon,bg){return `<div class="bg-white rounded-[22px] p-4 sm:p-5 soft flex justify-between gap-2"><div><p class="text-xs sm:text-sm text-slate-400">${title}</p><div class="text-2xl sm:text-3xl font-semibold mt-2">${value}</div></div><div class="w-11 h-11 rounded-2xl grid place-items-center text-xl" style="background:${bg}">${icon}</div></div>`;}
function button(text,action,cls='primary',extra=''){return `<button class="btn ${cls} text-sm" data-action="${action}" ${extra}>${text}</button>`;}
function empty(msg='ยังไม่มีข้อมูล'){return `<div class="p-12 text-center text-slate-400">🌤️<p class="mt-2">${esc(msg)}</p></div>`;}
function statusLabel(s){return ({active:'ทำงาน',leave:'ลางาน',resigned:'พ้นสภาพ',passed:'ผ่าน',failed:'ไม่ผ่าน',pending:'รอผล'})[s]||s;}
function pill(s){const c=({active:'bg-emerald-50 text-emerald-600',passed:'bg-emerald-50 text-emerald-600',leave:'bg-amber-50 text-amber-600',pending:'bg-amber-50 text-amber-600',resigned:'bg-rose-50 text-rose-600',failed:'bg-rose-50 text-rose-600'})[s]||'bg-slate-100';return `<span class="px-3 py-1 rounded-full text-xs ${c}">${esc(statusLabel(s))}</span>`;}
function nav(){ $('#desktop-nav').innerHTML=menus.map(([id,ic,label])=>`<button data-page="${id}" class="w-full flex gap-3 items-center px-4 py-3 rounded-2xl text-sm ${state.page===id?'nav-active':'text-slate-500 hover:bg-slate-50'}"><i data-lucide="${ic}" class="w-5 h-5"></i>${label}</button>`).join('');$('#mobile-menu-grid').innerHTML=menus.map(([id,ic,label])=>`<button data-page="${id}" class="rounded-2xl p-3 bg-[#f6f8fe] flex flex-col items-center gap-2 text-xs ${state.page===id?'text-blue-600':''}"><i data-lucide="${ic}" class="w-6 h-6"></i>${label}</button>`).join('');$$('.bottom-btn').forEach(x=>x.classList.toggle('text-blue-600',x.dataset.page===state.page));icons();}
function go(page){state.page=page;state.search='';state.branch='';$('#mobile-menu').hidden=true;const t=titles[page];$('#page-title').textContent=t[0];$('#page-subtitle').textContent=t[1];nav();render();window.scrollTo({top:0,behavior:'smooth'});}
async function load(){busy(true,'กำลังโหลดข้อมูลจาก Supabase...');try{const results=await Promise.all(tables.map(t=>dbClient.from(t).select('*').limit(5000)));for(let i=0;i<tables.length;i++){if(results[i].error)throw results[i].error;state.data[tables[i]]=results[i].data||[];}render();}catch(e){failure(e);$('#content').innerHTML=empty('โหลดข้อมูลไม่สำเร็จ ตรวจสอบ SQL, RLS และการเชื่อมต่อ');}finally{busy(false);}}
function render(){if(state.chart){state.chart.destroy();state.chart=null;}const views={dashboard:dashboard,employees:employees,training:training,courses:courses,reports:reports,settings:settings};$('#content').innerHTML=views[state.page]();icons();if(state.page==='dashboard'||state.page==='reports')makeChart();}
function branchSelect(all=true){return `<select id="branch-filter" class="field max-w-[220px]"><option value="">${all?'ทุกสาขา':'เลือกสาขา'}</option>${arr('branches').map(x=>`<option value="${attr(x.id)}" ${state.branch===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;}
function dashboard(){const ee=arr('employees'), rr=arr('training_records');const active=ee.filter(e=>e.status==='active').length;const expiry=rr.filter(r=>r.expiry_date&&r.expiry_date<=new Date(Date.now()+90*86400000).toISOString().slice(0,10)&&r.result==='passed').length;return `<div class="rounded-[26px] bg-gradient-to-r from-[#e2efff] to-[#fff0f7] p-5 sm:p-7 mb-6 flex justify-between items-center"><div><p class="text-xs text-blue-500">WELCOME BACK ✨</p><h2 class="text-xl sm:text-2xl font-semibold mt-2">จัดการบุคลากรได้ง่ายในที่เดียว</h2><p class="text-sm text-slate-500 mt-2">ทะเบียนพนักงาน • ประวัติการอบรม • ติดตามใบรับรอง</p></div><div class="text-5xl sm:text-7xl hidden sm:block">👩🏻‍🏫</div></div><div class="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-5">${card('พนักงานทั้งหมด',ee.length,'👥','#e6f0ff')}${card('กำลังทำงาน',active,'💙','#e8f7ec')}${card('รอบอบรม',arr('training_sessions').length,'🎓','#fff0f4')}${card('ใบรับรองใกล้/หมดอายุ',expiry,'📋','#fff6dc')}</div><div class="grid xl:grid-cols-5 gap-5 mt-6"><div class="xl:col-span-3 bg-white rounded-[24px] p-5 soft"><h3 class="font-semibold mb-5">พนักงานแยกสาขา</h3><div class="h-[250px]"><canvas id="summary-chart"></canvas></div></div><div class="xl:col-span-2 bg-white rounded-[24px] p-5 soft"><div class="flex justify-between mb-4"><h3 class="font-semibold">การอบรมล่าสุด</h3><button data-page="training" class="text-blue-500 text-xs">ดูทั้งหมด</button></div>${arr('training_sessions').slice().sort((a,b)=>b.training_date.localeCompare(a.training_date)).slice(0,5).map(x=>`<div class="border-b border-slate-100 py-3"><div class="font-medium text-sm">${esc(courseName(x.course_id))}</div><p class="text-xs text-slate-400 mt-1">${fmt(x.training_date)} · ${esc(name('branches',x.branch_id))}</p></div>`).join('')||empty()}</div></div>`;}
function makeChart(){const canvas=$('#summary-chart');if(!canvas||!window.Chart)return;const counts=arr('branches').map(b=>arr('employees').filter(e=>e.branch_id===b.id).length);state.chart=new Chart(canvas,{type:'bar',data:{labels:arr('branches').map(x=>x.name),datasets:[{data:counts,backgroundColor:['#98baf4','#f5bdd1','#f1d894','#a6d9bb'],borderRadius:12,barThickness:43}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false}}}}});}
function employees(){const q=state.search.toLowerCase();const rows=arr('employees').filter(e=>(!state.branch||e.branch_id===state.branch)&&[e.employee_code,e.first_name,e.last_name,e.nickname].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>a.employee_code.localeCompare(b.employee_code));return `<div class="flex gap-3 flex-wrap justify-between mb-5"><div class="flex gap-2 flex-wrap flex-1"><input id="search" value="${attr(state.search)}" class="field max-w-sm" placeholder="🔎 ค้นหาชื่อหรือรหัสพนักงาน">${branchSelect()}</div>${button('+ เพิ่มพนักงาน','add-employee')}</div><div class="bg-white rounded-[24px] soft overflow-x-auto"><table class="w-full text-sm min-w-[700px]"><thead class="bg-[#f2f6ff] text-slate-500"><tr>${['พนักงาน','รหัส','สาขา/แผนก','ตำแหน่ง','สถานะ','จัดการ'].map(x=>`<th class="text-left font-medium p-4">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(e=>`<tr class="border-t border-slate-50"><td class="p-3"><div class="flex items-center gap-3">${photo(e)}<div><b>${esc(e.first_name)} ${esc(e.last_name)}</b><p class="text-xs text-slate-400">${esc(e.nickname||'')}</p></div></div></td><td>${esc(e.employee_code)}</td><td>${esc(name('branches',e.branch_id))}<p class="text-xs text-slate-400">${esc(name('departments',e.department_id))}</p></td><td>${esc(name('positions',e.position_id))}</td><td>${pill(e.status)}</td><td class="whitespace-nowrap"><button data-action="history" data-id="${e.id}" class="text-blue-500 px-2">ประวัติ</button><button data-action="edit-employee" data-id="${e.id}" class="text-slate-500 px-2">แก้ไข</button><button data-action="delete-employee" data-id="${e.id}" class="text-rose-400 px-2">ลบ</button></td></tr>`).join('')||`<tr><td colspan="6">${empty('ไม่พบพนักงาน')}</td></tr>`}</tbody></table></div><p class="text-xs text-slate-400 mt-3">แสดง ${rows.length} คน</p>`;}
function courses(){return `<div class="flex justify-end mb-4">${button('+ เพิ่มหลักสูตร','add-course')}</div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${arr('courses').map(c=>`<div class="bg-white rounded-[23px] p-5 soft"><div class="w-12 h-12 rounded-2xl bg-[#fff0f6] grid place-items-center text-2xl mb-3">📚</div><p class="text-xs text-blue-500">${esc(c.code)} · ${esc(c.category)}</p><h3 class="text-lg font-medium mt-1">${esc(c.title)}</h3><p class="text-sm text-slate-400 mt-2">${c.duration_hours} ชั่วโมง · อายุใบรับรอง ${c.validity_months||'ไม่กำหนด'} เดือน</p><p class="text-sm text-slate-500 mt-2 min-h-10">${esc(c.description||'')}</p><div class="flex gap-4 border-t mt-4 pt-4 text-sm"><button data-action="edit-course" data-id="${c.id}" class="text-blue-500">แก้ไข</button><button data-action="delete-course" data-id="${c.id}" class="text-rose-400">ลบ</button></div></div>`).join('')||empty()}</div>`;}
function training(){const ss=arr('training_sessions').filter(s=>!state.branch||s.branch_id===state.branch).sort((a,b)=>b.training_date.localeCompare(a.training_date));return `<div class="flex justify-between flex-wrap gap-2 mb-4">${branchSelect()}${button('+ จัดรอบอบรม','add-session')}</div><div class="grid lg:grid-cols-2 gap-4">${ss.map(s=>{const records=arr('training_records').filter(r=>r.session_id===s.id);return `<div class="bg-white rounded-[24px] p-5 soft"><div class="flex justify-between gap-2"><div><p class="text-xs text-blue-500">${fmt(s.training_date)} · ${esc(name('branches',s.branch_id))}</p><h3 class="font-semibold text-lg mt-2">${esc(courseName(s.course_id))}</h3></div><div class="text-3xl">🎓</div></div><p class="text-xs text-slate-400 mt-2">วิทยากร: ${esc(s.trainer||'-')} · ${esc(s.location||'-')}</p><p class="text-sm mt-3">ผู้เข้าร่วม ${records.length} คน · ผ่าน ${records.filter(r=>r.result==='passed').length} คน</p><div class="flex gap-3 flex-wrap border-t mt-4 pt-4 text-sm"><button class="text-blue-600" data-action="participants" data-id="${s.id}">จัดการผู้เข้าอบรม</button><button class="text-slate-500" data-action="edit-session" data-id="${s.id}">แก้ไขรอบ</button><button class="text-rose-400" data-action="delete-session" data-id="${s.id}">ลบ</button></div></div>`}).join('')||empty()}</div>`;}
function reports(){const ee=arr('employees'),rr=arr('training_records'), passed=rr.filter(r=>r.result==='passed');const due=passed.filter(r=>r.expiry_date&&r.expiry_date<=new Date(Date.now()+90*86400000).toISOString().slice(0,10));return `<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-5">${card('พนักงาน',ee.length,'👥','#e6f0ff')}${card('อบรมผ่านแล้ว',passed.length,'🎯','#e8f7ec')}${card('ใบรับรองใกล้/หมดอายุ',due.length,'⏳','#fff2d8')}</div><div class="bg-white rounded-3xl p-5 soft mb-5"><h3 class="font-semibold mb-3">สัดส่วนพนักงานตามสาขา</h3><div class="h-64"><canvas id="summary-chart"></canvas></div></div><div class="bg-white rounded-3xl p-5 soft"><div class="flex flex-wrap justify-between gap-2"><h3 class="font-semibold">ทะเบียนการอบรมทั้งหมด</h3>${button('ส่งออก CSV','csv','secondary')}</div><div class="overflow-x-auto mt-4"><table class="w-full text-sm min-w-[610px]"><thead><tr class="text-left text-slate-400"><th>พนักงาน</th><th>หลักสูตร</th><th>วันที่อบรม</th><th>ผล</th><th>วันหมดอายุ</th></tr></thead><tbody>${rr.map(r=>{const s=by('training_sessions',r.session_id);return `<tr class="border-t"><td class="py-3">${esc(empName(r.employee_id))}</td><td>${esc(courseName(s?.course_id))}</td><td>${fmt(s?.training_date)}</td><td>${pill(r.result)}</td><td>${fmt(r.expiry_date)}</td></tr>`}).join('')}</tbody></table></div></div>`;}
function settings(){return `<div class="grid lg:grid-cols-3 gap-4">${[['branches','สาขา','🏭'],['departments','แผนก','🧩'],['positions','ตำแหน่ง','🪄']].map(([t,label,em])=>`<div class="bg-white p-5 rounded-3xl soft"><div class="flex justify-between items-center mb-4"><h3 class="font-semibold">${em} ${label}</h3><button data-action="add-master" data-table="${t}" class="text-blue-500 text-sm">+ เพิ่ม</button></div>${arr(t).map(x=>`<div class="flex justify-between items-center gap-2 border-t py-3"><div><b class="text-sm">${esc(x.name)}</b><p class="text-xs text-slate-400">${esc(x.code)}</p></div><div class="text-xs flex gap-2"><button class="text-blue-500" data-action="edit-master" data-table="${t}" data-id="${x.id}">แก้ไข</button><button class="text-rose-400" data-action="delete-master" data-table="${t}" data-id="${x.id}">ลบ</button></div></div>`).join('')}</div>`).join('')}</div><div class="mt-5 bg-[#fff8e6] rounded-2xl p-4 text-sm text-amber-800">⚠️ โหมดทดสอบ: ผู้ใช้ทุกคนที่ล็อกอินสามารถจัดการข้อมูลได้ทุกสาขา ก่อนใช้งานจริงต้องกำหนดสิทธิ์ HR/Admin และจำกัดตามสาขาใน RLS</div>`;}
function field(label,key,type='text',val='',required=false){return `<label class="block text-sm">${label}<input name="${key}" type="${type}" ${required?'required':''} value="${attr(val??'')}" class="field mt-1"></label>`;}
function choice(label,key,options,val='',required=false){return `<label class="block text-sm">${label}<select name="${key}" class="field mt-1" ${required?'required':''}><option value="">-- เลือก --</option>${options.map(o=>`<option value="${attr(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`;}
function opts(t){return arr(t).map(x=>({value:x.id,label:x.name||x.title||x.employee_code}));}function optionsEnum(data){return data.map(([value,label])=>({value,label}));}
function textArea(label,key,val=''){return `<label class="block text-sm">${label}<textarea name="${key}" class="field mt-1" rows="2">${esc(val||'')}</textarea></label>`;}
function modal(title,markup,submit){$('#modal-title').textContent=title;$('#modal-form').innerHTML=markup+`<div class="flex justify-end gap-2 pt-4"><button type="button" class="btn secondary" data-action="close-modal">ยกเลิก</button><button id="form-save" type="submit" class="btn primary">บันทึกข้อมูล</button></div>`;$('#modal').hidden=false;$('#modal-form').onsubmit=async ev=>{ev.preventDefault();const btn=$('#form-save');btn.disabled=true;btn.textContent='กำลังบันทึก...';busy(true,'กำลังบันทึกข้อมูล...');try{await submit(new FormData(ev.currentTarget));$('#modal').hidden=true;await load();toast('บันทึกข้อมูลสำเร็จ');}catch(e){failure(e);}finally{busy(false);btn.disabled=false;btn.textContent='บันทึกข้อมูล';}};icons();}
function closeModal(){$('#modal').hidden=true;}
function formObject(fd, keys){const d={};for(const key of keys){const v=fd.get(key);d[key]=v===''?null:v;}return d;}
async function save(table,body,id){const q=id?dbClient.from('hr_'+table).update(body).eq('id',id):dbClient.from('hr_'+table).insert(body);const {error}=await q;if(error)throw error;}
async function remove(table,id){if(!confirm('ยืนยันการลบข้อมูล? การลบบางรายการอาจส่งผลต่อประวัติที่เชื่อมโยง'))return;busy(true,'กำลังลบข้อมูล...');try{const {error}=await dbClient.from('hr_'+table).delete().eq('id',id);if(error)throw error;await load();toast('ลบข้อมูลแล้ว');}catch(e){failure(e);}finally{busy(false);}}
function employeeModal(id){const e=by('employees',id)||{};modal(id?'แก้ไขข้อมูลพนักงาน':'เพิ่มพนักงาน',`<div class="grid sm:grid-cols-2 gap-3">${field('รหัสพนักงาน *','employee_code','text',e.employee_code,true)}${choice('สาขา *','branch_id',opts('branches'),e.branch_id,true)}${field('ชื่อ *','first_name','text',e.first_name,true)}${field('นามสกุล *','last_name','text',e.last_name,true)}${field('ชื่อเล่น','nickname','text',e.nickname)}${field('โทรศัพท์','phone','tel',e.phone)}${choice('แผนก','department_id',opts('departments'),e.department_id)}${choice('ตำแหน่ง','position_id',opts('positions'),e.position_id)}${field('วันเริ่มงาน *','start_date','date',shortDate(e.start_date)||new Date().toISOString().slice(0,10),true)}${field('วันเกิด','birth_date','date',shortDate(e.birth_date))}${field('อีเมล','email','email',e.email)}${choice('สถานะ','status',optionsEnum([['active','ทำงาน'],['leave','ลางาน'],['resigned','พ้นสภาพ']]),e.status||'active')}${choice('ประเภทการจ้าง','employment_type',optionsEnum([['ประจำ','ประจำ'],['รายวัน','รายวัน'],['สัญญาจ้าง','สัญญาจ้าง']]),e.employment_type||'ประจำ')}${field('ติดต่อฉุกเฉิน','emergency_contact','text',e.emergency_contact)}</div>${textArea('ที่อยู่','address',e.address)}${textArea('หมายเหตุ','notes',e.notes)}<label class="block text-sm">รูปภาพพนักงาน (อัปโหลด JPEG/PNG/WebP บีบอัดเป็น WebP อัตโนมัติ)<input name="photo" type="file" accept="image/png,image/jpeg,image/webp" class="field mt-1"></label>${e.photo_path?`<p class="text-xs text-slate-400">มีรูปเดิมแล้ว · อัปโหลดเพื่อเปลี่ยนรูป</p>`:''}`,async fd=>{const keys=['employee_code','first_name','last_name','nickname','branch_id','department_id','position_id','start_date','birth_date','phone','email','address','emergency_contact','employment_type','status','notes'];const data=formObject(fd,keys);let newPath=null;const file=fd.get('photo');if(file&&file.size){const compressed=await compress(file);newPath=`employees/${crypto.randomUUID()}.webp`;const {error}=await dbClient.storage.from('hr-photos').upload(newPath,compressed,{contentType:'image/webp',upsert:false});if(error)throw error;data.photo_path=newPath;}try{await save('employees',data,id);}catch(err){if(newPath)await dbClient.storage.from('hr-photos').remove([newPath]);throw err;}if(newPath&&e.photo_path)await dbClient.storage.from('hr-photos').remove([e.photo_path]);});}
async function compress(file){if(!file.type.startsWith('image/'))throw Error('กรุณาเลือกไฟล์ภาพ');if(file.size>15*1024*1024)throw Error('ไฟล์ต้นฉบับต้องไม่เกิน 15 MB');const bitmap=await createImageBitmap(file);const scale=Math.min(1,960/Math.max(bitmap.width,bitmap.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close?.();let quality=.75;let blob;for(let k=0;k<5;k++){blob=await new Promise(resolve=>c.toBlob(resolve,'image/webp',quality));if(!blob)throw Error('ไม่สามารถบีบอัดภาพได้');if(blob.size<=450*1024)break;quality=Math.max(.3,quality-.12);}if(blob.size>1024*1024)throw Error('ภาพมีขนาดเกิน 1 MB หลังบีบอัด');return blob;}
function courseModal(id){const c=by('courses',id)||{};modal(id?'แก้ไขหลักสูตร':'เพิ่มหลักสูตร',`<div class="grid sm:grid-cols-2 gap-3">${field('รหัสหลักสูตร *','code','text',c.code,true)}${field('ชื่อหลักสูตร *','title','text',c.title,true)}${field('หมวดหมู่','category','text',c.category||'ทั่วไป')}${field('ระยะเวลา (ชั่วโมง)','duration_hours','number',c.duration_hours??0)}${field('อายุใบรับรอง (เดือน)','validity_months','number',c.validity_months)}</div>${textArea('รายละเอียด','description',c.description)}`,async fd=>{const d=formObject(fd,['code','title','category','duration_hours','validity_months','description']);d.duration_hours=Number(d.duration_hours||0);d.validity_months=d.validity_months?Number(d.validity_months):null;await save('courses',d,id);});}
function sessionModal(id){const s=by('training_sessions',id)||{};modal(id?'แก้ไขรอบอบรม':'จัดรอบอบรม',`<div class="grid sm:grid-cols-2 gap-3">${choice('หลักสูตร *','course_id',opts('courses'),s.course_id,true)}${choice('สาขา','branch_id',opts('branches'),s.branch_id)}${field('วันที่อบรม *','training_date','date',s.training_date||new Date().toISOString().slice(0,10),true)}${field('วิทยากร','trainer','text',s.trainer)}${field('สถานที่','location','text',s.location)}${field('ค่าใช้จ่าย (บาท)','cost','number',s.cost??0)}</div>${textArea('หมายเหตุ','notes',s.notes)}`,async fd=>{const d=formObject(fd,['course_id','branch_id','training_date','trainer','location','cost','notes']);d.cost=Number(d.cost||0);await save('training_sessions',d,id);});}
function masterModal(t,id){const obj=by(t,id)||{};const labels={branches:'สาขา',departments:'แผนก',positions:'ตำแหน่ง'};modal(`${id?'แก้ไข':'เพิ่ม'}${labels[t]}`,`${field('รหัส *','code','text',obj.code,true)}${field('ชื่อ *','name','text',obj.name,true)}${t==='branches'?field('ที่ตั้ง','location','text',obj.location):''}${t==='positions'?choice('แผนก','department_id',opts('departments'),obj.department_id):''}`,async fd=>{await save(t,formObject(fd,['code','name',...(t==='branches'?['location']:[]),...(t==='positions'?['department_id']:[])]),id);});}
function history(id){const e=by('employees',id);if(!e)return;const rr=arr('training_records').filter(r=>r.employee_id===id).sort((a,b)=>(by('training_sessions',b.session_id)?.training_date||'').localeCompare(by('training_sessions',a.session_id)?.training_date||''));modal('ประวัติพนักงาน',`<div class="flex items-center gap-4">${photo(e,72)}<div><h3 class="font-semibold text-lg">${esc(empName(id))}</h3><p class="text-sm text-slate-400">${esc(e.employee_code)} · ${esc(name('branches',e.branch_id))}</p><p class="text-sm">${esc(name('positions',e.position_id))} · เริ่มงาน ${fmt(e.start_date)}</p></div></div><h3 class="font-semibold mt-5">ประวัติการอบรม (${rr.length} รายการ)</h3><div class="space-y-3">${rr.map(r=>{const s=by('training_sessions',r.session_id);return `<div class="bg-[#f7f9fe] rounded-2xl p-3"><div class="flex justify-between"><b>${esc(courseName(s?.course_id))}</b>${pill(r.result)}</div><p class="text-xs text-slate-500 mt-1">อบรม ${fmt(s?.training_date)} · หมดอายุ ${fmt(r.expiry_date)} · เลขที่ ${esc(r.certificate_no||'-')}</p></div>`}).join('')||empty('ยังไม่มีประวัติอบรม')}</div>`,async()=>{});$('#modal-form').querySelector('[type=submit]').remove();}
function participants(id){const s=by('training_sessions',id);if(!s)return;const rr=arr('training_records').filter(r=>r.session_id===id);const avail=arr('employees').filter(e=>!rr.some(r=>r.employee_id===e.id));modal('ผู้เข้าอบรม · '+courseName(s.course_id),`<p class="text-sm text-slate-400">${fmt(s.training_date)} · เพิ่มพนักงานที่ยังไม่อยู่ในรอบนี้</p>${choice('พนักงาน','employee_id',avail.map(e=>({value:e.id,label:e.employee_code+' · '+e.first_name+' '+e.last_name})))}${choice('ผลอบรม','result',optionsEnum([['passed','ผ่าน'],['failed','ไม่ผ่าน'],['pending','รอผล']]),'passed')}${field('คะแนน','score','number')}${field('เลขใบรับรอง','certificate_no')}${field('วันหมดอายุ','expiry_date','date')}<div class="border-t pt-3"><b>ผู้เข้าร่วมแล้ว (${rr.length})</b>${rr.map(r=>`<div class="py-2 flex items-center justify-between gap-2 border-b"><span class="text-sm">${esc(empName(r.employee_id))} ${pill(r.result)}</span><span><button type="button" class="text-blue-500 text-xs mr-2" data-action="edit-record" data-id="${r.id}">แก้ไข</button><button type="button" class="text-rose-500 text-xs" data-action="delete-record" data-id="${r.id}">ลบ</button></span></div>`).join('')||empty('ยังไม่มีผู้เข้าร่วม')}</div>`,async fd=>{const emp=fd.get('employee_id');if(!emp)throw Error('กรุณาเลือกพนักงาน');const d=formObject(fd,['employee_id','result','score','certificate_no','expiry_date']);d.session_id=id;d.score=d.score?Number(d.score):null;if(!d.expiry_date&&d.result==='passed'){const months=by('courses',s.course_id)?.validity_months;if(months){const dt=new Date(s.training_date+'T12:00:00');dt.setMonth(dt.getMonth()+months);d.expiry_date=dt.toISOString().slice(0,10);}}await save('training_records',d);});}
function recordModal(id){const r=by('training_records',id);if(!r)return;modal('แก้ไขผลการอบรม · '+empName(r.employee_id),`${choice('ผลอบรม','result',optionsEnum([['passed','ผ่าน'],['failed','ไม่ผ่าน'],['pending','รอผล']]),r.result)}${field('คะแนน','score','number',r.score)}${field('เลขใบรับรอง','certificate_no','text',r.certificate_no)}${field('วันหมดอายุ','expiry_date','date',r.expiry_date)}${textArea('หมายเหตุ','remarks',r.remarks)}`,async fd=>{const d=formObject(fd,['result','score','certificate_no','expiry_date','remarks']);d.score=d.score?Number(d.score):null;await save('training_records',d,id);});}
function csv(){const data=[['รหัสพนักงาน','ชื่อ-สกุล','สาขา','หลักสูตร','วันอบรม','ผล','วันหมดอายุ']];for(const r of arr('training_records')){const e=by('employees',r.employee_id),s=by('training_sessions',r.session_id);data.push([e?.employee_code,empName(r.employee_id),name('branches',e?.branch_id),courseName(s?.course_id),s?.training_date,statusLabel(r.result),r.expiry_date]);}const csvText='\ufeff'+data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csvText],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='pyro-hr-training.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function action(el){const a=el.dataset.action,id=el.dataset.id,t=el.dataset.table;try{switch(a){case 'refresh':await load();break;case 'toggle-menu':$('#mobile-menu').hidden=!$('#mobile-menu').hidden;break;case 'close-menu':$('#mobile-menu').hidden=true;break;case 'close-modal':closeModal();break;case 'logout':busy(true);await dbClient.auth.signOut();busy(false);break;case 'add-employee':employeeModal();break;case 'edit-employee':employeeModal(id);break;case 'delete-employee':await remove('employees',id);break;case 'history':history(id);break;case 'add-course':courseModal();break;case 'edit-course':courseModal(id);break;case 'delete-course':await remove('courses',id);break;case 'add-session':sessionModal();break;case 'edit-session':sessionModal(id);break;case 'delete-session':await remove('training_sessions',id);break;case 'participants':participants(id);break;case 'edit-record':recordModal(id);break;case 'delete-record':closeModal();await remove('training_records',id);break;case 'add-master':masterModal(t);break;case 'edit-master':masterModal(t,id);break;case 'delete-master':await remove(t,id);break;case 'csv':csv();break;}}catch(e){busy(false);failure(e);}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-page]');if(!target)return;if(target.dataset.page)go(target.dataset.page);else action(target);});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const start=e.target.selectionStart;render();const inp=$('#search');inp.focus();inp.setSelectionRange(start,start);}});
document.addEventListener('change',e=>{if(e.target.id==='branch-filter'){state.branch=e.target.value;render();}});
$('#login-form').addEventListener('submit',async ev=>{ev.preventDefault();busy(true,'กำลังเข้าสู่ระบบ...');try{const {error}=await dbClient.auth.signInWithPassword({email:$('#login-email').value,password:$('#login-password').value});if(error)throw error;}catch(e){failure(e);}finally{busy(false);}});
async function showSession(session){state.user=session?.user||null;$('#auth-screen').hidden=!!state.user;$('#app').hidden=!state.user;if(state.user){nav();go(state.page);await load();}else{state.data={};}}
(async()=>{if(!SUPABASE_URL||SUPABASE_URL.includes('YOUR-PROJECT')||!SUPABASE_ANON_KEY||SUPABASE_ANON_KEY.includes('YOUR-')){toast('ตั้งค่า URL และ ANON KEY ใน config.js ก่อนใช้งาน',true);return;}let previousUser=null;dbClient.auth.onAuthStateChange((event,session)=>{const id=session?.user?.id||null;if(id!==previousUser){previousUser=id;setTimeout(()=>showSession(session),0);}});const {data,error}=await dbClient.auth.getSession();if(error)failure(error);if(data?.session&&!previousUser){previousUser=data.session.user.id;await showSession(data.session);}})();
</script></body></html>
